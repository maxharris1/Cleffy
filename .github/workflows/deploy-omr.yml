# Auto-deploy the OMR Cloud Run service when main changes services/omr-service/.
#
# GitHub Actions variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID                  (fallback: cleffy-504715)
#   GCP_REGION                      (fallback: us-central1)
#   GCP_OMR_SERVICE                 (fallback: cleffy-omr)
#   GCP_WORKLOAD_IDENTITY_PROVIDER  (required; no fallback)
#   GCP_DEPLOY_SA                   (required; no fallback)
#   GCP_OMR_SEED_SERVICE            (optional; e.g. cleffy-omr-seed — unset skips the seed pool)
#
# Do not add --set-env-vars / --clear-env-vars: existing Cloud Run env stays.
# Do not add --allow-unauthenticated / --no-allow-unauthenticated: leave IAM as-is.
# Do not store OMR_SERVICE_SECRET (or any runtime secret) in GitHub.

name: Deploy OMR

on:
    push:
        branches: [main]
        paths:
            - 'services/omr-service/**'
            - '.github/workflows/deploy-omr.yml'
    workflow_dispatch:

jobs:
    omr-checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/omr-service
        steps:
            # Full history: check:engine-version diffs against the base ref, and a
            # depth-1 clone has no origin/main to diff against — the script would
            # silently skip and let an unbumped ENGINE_VERSION through.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: services/omr-service/package-lock.json
            - run: npm ci
            - run: npm run check:engine-version
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    deploy:
        needs: omr-checks
        runs-on: ubuntu-latest
        timeout-minutes: 40
        concurrency:
            group: deploy-omr
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cleffy-504715' }}
            GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
            GCP_OMR_SERVICE: ${{ vars.GCP_OMR_SERVICE || 'cleffy-omr' }}
        steps:
            - uses: actions/checkout@v4
            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_DEPLOY_SA }}
            - uses: google-github-actions/setup-gcloud@v2
            - name: Deploy Cloud Run
              run: |
                  gcloud run deploy "${GCP_OMR_SERVICE}" \
                    --project="${GCP_PROJECT_ID}" \
                    --region="${GCP_REGION}" \
                    --source=services/omr-service \
                    --memory=16Gi --cpu=2 --timeout=3600 \
                    --concurrency=1 --min-instances=0 --max-instances=3 \
                    --no-cpu-throttling --cpu-boost --quiet
            - name: Health check
              run: |
                  URL="$(gcloud run services describe "${GCP_OMR_SERVICE}" \
                    --project="${GCP_PROJECT_ID}" \
                    --region="${GCP_REGION}" \
                    --format='value(status.url)')"
                  RESP="$(curl -fsS "${URL}/healthz")"
                  echo "${RESP}"
                  echo "${RESP}" | grep -q '"ok":true'
                  echo "${RESP}" | grep -q '"engineVersion"'

    # Seed-only worker pool (plan Phase 2c): a second service on the SAME image
    # cleffy-omr just received, so both claim with the same ENGINE_VERSION. Only
    # runs once GCP_OMR_SEED_SERVICE is set, i.e. after the one-off
    # services/omr-service/scripts/deploy-seed.sh created the service and set its
    # env (CLEFFY_CLAIM_MAX_PRIORITY=-1 etc.). Env / IAM are left untouched here,
    # same rule as the user service. Resources are pinned on purpose: raise
    # --max-instances here (or via deploy-seed.sh), never on cleffy-omr.
    deploy-seed:
        needs: deploy
        if: ${{ vars.GCP_OMR_SEED_SERVICE != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: deploy-omr-seed
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        env:
            GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cleffy-504715' }}
            GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
            GCP_OMR_SERVICE: ${{ vars.GCP_OMR_SERVICE || 'cleffy-omr' }}
            GCP_OMR_SEED_SERVICE: ${{ vars.GCP_OMR_SEED_SERVICE }}
        steps:
            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_DEPLOY_SA }}
            - uses: google-github-actions/setup-gcloud@v2
            - name: Deploy seed pool on the user worker's image
              run: |
                  IMAGE="$(gcloud run services describe "${GCP_OMR_SERVICE}" \
                    --project="${GCP_PROJECT_ID}" \
                    --region="${GCP_REGION}" \
                    --format='value(spec.template.spec.containers[0].image)')"
                  test -n "${IMAGE}"
                  gcloud run deploy "${GCP_OMR_SEED_SERVICE}" \
                    --project="${GCP_PROJECT_ID}" \
                    --region="${GCP_REGION}" \
                    --image="${IMAGE}" \
                    --memory=4Gi --cpu=2 --timeout=3600 \
                    --concurrency=1 --min-instances=0 --max-instances=5 \
                    --no-cpu-throttling --cpu-boost --quiet
            - name: Health check
              run: |
                  URL="$(gcloud run services describe "${GCP_OMR_SEED_SERVICE}" \
                    --project="${GCP_PROJECT_ID}" \
                    --region="${GCP_REGION}" \
                    --format='value(status.url)')"
                  RESP="$(curl -fsS "${URL}/healthz")"
                  echo "${RESP}"
                  echo "${RESP}" | grep -q '"ok":true'
                  echo "${RESP}" | grep -q '"engineVersion"'
