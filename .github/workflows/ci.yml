name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # Runtime dependencies only, high and critical: everything in
            # `dependencies` ships to the browser (pdf.js parses every untrusted
            # score), so a known hole there blocks the build. Dev tooling never
            # reaches users and is left to routine upgrades.
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high
            - run: npm run lint:check
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    # The checkout and cancel-link proofs that need a real database (decision
    # 30 on #62): the store test runs billingCancelStore.ts against PostgREST,
    # and the SQL proofs exercise the triggers, grants, row locks and the
    # database clock that the mocked unit tests cannot.
    #
    # LOCAL stack only: `supabase start` on this runner, the migrations it
    # applies, and the demo keys it prints. No repository secrets, no hosted
    # project, no link. Scoped to these proofs; billing_double_charge.sql is
    # left to its own PR (decision 20). No browser is installed or run.
    supabase-local:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: supabase/setup-cli@v1
              with:
                  version: 2.121.0
            # Only what these proofs touch: Postgres, Auth (the store test
            # creates accounts), PostgREST and the gateway in front of them.
            - name: Start the local Supabase stack and apply every migration
              run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
            # A recovery replays migrations over a database that already has
            # them; these must apply again cleanly, in order.
            - name: Re-apply the cancel-link migrations
              run: |
                  DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
                  for migration in 20261020160300_cancel_link_token_lifetime 20261020160400_cancel_link_tombstones_db_clock 20261020160500_cancel_link_save_replayable 20261020160600_cancel_link_serialized_history 20261020160700_cancel_link_consume_db_clock; do
                      psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/migrations/${migration}.sql"
                  done
            - name: Cancel-link store test (billingCancelStore.ts against the local stack)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
                      npx vitest run tests/billing/cancelLinkStore.test.ts
            - name: Checkout and cancel-link SQL proofs
              run: |
                  DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
                  for proof in cancel_link_lifetime cancel_link_tombstones cancel_link_db_clock cancel_link_tombstone_race cancel_link_read_db_clock cancel_link_save_after_insert cancel_link_consume_db_clock checkout_consents launch_checkout_fixes district_retention_reattribution content_strikes_survive_deletion migrations_ordered_replay; do
                      bash scripts/ci/sql-proof.sh "$DB_URL" "tests/sql/${proof}.sql"
                  done

    omr-service:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/omr-service
        steps:
            # Full history: check:engine-version diffs against the base ref, and a
            # depth-1 clone has no origin/main to diff against — the script would
            # silently skip and let an unbumped ENGINE_VERSION through.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: services/omr-service/package-lock.json
            - run: npm ci
            - run: npm run check:engine-version
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    # Does the branch still describe the live project?
    #
    # Added after migrations were applied straight to production ahead of the
    # merge that carried them: `main` stopped describing production and nothing
    # said so. Supabase's GitHub integration deploys on merge but never checks
    # that the branch was the source of what is already live, so this is the only
    # thing standing between "someone ran it from the dashboard" and a `main` that
    # quietly lies about production.
    #
    # Reads only — it never applies or deploys anything; the integration does
    # that.
    supabase-drift:
        runs-on: ubuntu-latest
        # Fork PRs get no secrets, so the check could only ever fail there for a
        # reason that is not about the code.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # Without the token this job cannot answer its question. It warns
            # rather than fails ONLY for that case, so adding the guard does not
            # redden every branch before the secret exists — but it says so
            # loudly, because a guard nobody notices is off is worse than none.
            # Once SUPABASE_ACCESS_TOKEN is set, drift is a hard failure.
            - name: Check for drift against the live project
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'jibgwgosihadbjgxdsfe' }}
              run: |
                  if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                      echo "::warning title=Supabase drift check is INERT::SUPABASE_ACCESS_TOKEN is not set on this repository, so nothing verified that this branch matches the live project. Add it under Settings -> Secrets and variables -> Actions."
                      exit 0
                  fi
                  node scripts/check-supabase-drift.mjs
