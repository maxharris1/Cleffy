name: CI

on:
    push:
        branches: [dev, main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - &checkout
              uses: actions/checkout@v4
            - &setup-node
              uses: actions/setup-node@v4
              id: node
              with:
                  node-version: 22
            - &restore-node-modules
              uses: actions/cache/restore@v4
              id: node-modules
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
            - &npm-ci
              name: npm ci
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci
            - &save-pristine-node-modules
              if: steps.node-modules.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: node_modules
                  key: ${{ steps.node-modules.outputs.cache-primary-key }}
            # Runtime dependencies only, high and critical: everything in
            # `dependencies` ships to the browser (pdf.js parses every untrusted
            # score), so a known hole there blocks the build. Dev tooling never
            # reaches users and is left to routine upgrades.
            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high
            - run: npm run lint:check

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - *checkout
            - *setup-node
            - *restore-node-modules
            - *npm-ci
            - *save-pristine-node-modules
            - run: npm run typecheck

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - *checkout
            - *setup-node
            - *restore-node-modules
            - *npm-ci
            - *save-pristine-node-modules
            - name: Vite build and bundle check
              run: npx vite build && node scripts/ci/check-bundle.mjs

    test:
        name: test (${{ matrix.shard }}/2)
        runs-on: ubuntu-latest
        timeout-minutes: 6
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - *checkout
            - *setup-node
            - *restore-node-modules
            - *npm-ci
            - *save-pristine-node-modules
            - run: npx vitest run --shard=${{ matrix.shard }}/2

    # The checks that need a real database (decision 30 on #62), in two
    # parallel jobs that each start their own stack. db-proofs runs the SQL
    # proofs, which exercise the triggers, grants, row locks and the database
    # clock that the mocked unit tests cannot. stack-tests runs the Vitest
    # files that talk to the stack (the store test runs billingCancelStore.ts
    # against PostgREST), then one browser test: the seeded QA accounts
    # signing in through the login form, against Vite on the runner.
    #
    # LOCAL stack only: `supabase start` on the runner, the migrations it
    # applies, and the demo keys it prints. No repository secrets, no hosted
    # project, no link. Every SQL proof runs in db-proofs (decision 37 / SF-16).
    db-proofs:
        runs-on: ubuntu-latest
        timeout-minutes: 6
        env:
            SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        steps:
            - *checkout
            # Before anything else opens connections, so no outbound socket
            # holds one of the stack's ports when `supabase start` publishes it.
            - &reserve-ports
              name: Reserve the stack's ports from the ephemeral range
              run: |
                  bash scripts/ci/reserve-supabase-ports.test.sh
                  sudo bash scripts/ci/reserve-supabase-ports.sh supabase/config.toml
            - &setup-cli
              uses: supabase/setup-cli@v1
              with:
                  version: 2.121.0
            # Only what the proofs touch: Postgres, Auth (the store test
            # creates accounts), PostgREST and the gateway in front of them,
            # Realtime (it creates the day's realtime.messages partition the
            # broadcast checks read, as on a developer's stack) and Storage
            # (its own migrations bring storage.objects to the schema the
            # storage checks write, as on every hosted project).
            - &start-stack-bg
              name: Start the local Supabase stack in the background
              run: |
                  (
                      rc=0
                      supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta >/tmp/supabase-start.log 2>&1 || rc=$?
                      echo "$rc" >/tmp/supabase-start.rc
                  ) </dev/null >/dev/null 2>&1 &
            - &wait-stack
              name: Wait for the stack to start and apply every migration
              run: |
                  while [ ! -s /tmp/supabase-start.rc ]; do sleep 1; done
                  cat /tmp/supabase-start.log
                  exit "$(cat /tmp/supabase-start.rc)"
            # The proofs need Realtime running, not only its schema: it creates
            # the day's realtime.messages partition the broadcast checks write
            # (sharing_access_control, district_read_only_seats, and launchfix
            # P4's realtime_revocation_rotation and content_moderation). Fail
            # here, by name, if it ever stops starting -- rather than as a
            # proof that silently finds no partition.
            - &realtime-probe
              name: Realtime is running and has created today's messages partition
              run: |
                  DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
                  docker ps --format '{{.Names}}' | grep -E '^supabase_realtime_' || { echo "::error::the Realtime container is not running"; exit 1; }
                  for attempt in $(seq 1 30); do
                      if [ "$(psql "$DB_URL" -tAc "select to_regclass('realtime.messages_' || to_char(now() at time zone 'utc', 'YYYY_MM_DD')) is not null")" = "t" ]; then
                          echo "Realtime is up: today's realtime.messages partition exists"
                          exit 0
                      fi
                      sleep 2
                  done
                  echo "::error::Realtime did not create today's realtime.messages partition"
                  exit 1
            # A recovery replays migrations over a database that already has
            # them; these must apply again cleanly, in order. The cancel-link
            # five, then every migration from launchfix P1 (20261022100000)
            # to the newest, in filename order: P1, P3, P4, P5 and the
            # follow-ups. Replaying through the newest leaves the latest
            # definition of every function a later migration redefines, so the
            # proofs below run against the schema a recovery ends on.
            - &replay-migrations
              name: Re-apply the cancel-link migrations and every migration from launchfix P1 on
              run: |
                  DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
                  for migration in 20261020160300_cancel_link_token_lifetime 20261020160400_cancel_link_tombstones_db_clock 20261020160500_cancel_link_save_replayable 20261020160600_cancel_link_serialized_history 20261020160700_cancel_link_consume_db_clock; do
                      psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/migrations/${migration}.sql"
                  done
                  for file in supabase/migrations/*.sql; do
                      if [[ "$(basename "$file")" < 20261022100000 ]]; then
                          continue
                      fi
                      echo "re-applying ${file}"
                      psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$file"
                  done
            # Every proof (decision 37 / SF-16): each tests/sql/*.sql, and the
            # sharing proof beside the migrations. A new proof runs by being
            # added -- scripts/ci/sql-proofs.sh changes only to skip one, which
            # needs a reason. Every proof runs even after one fails, and the
            # step fails at the end, so one red run shows them all. Any failing
            # check fails the job: there is no list of tolerated failures.
            - name: SQL proofs (tests/sql/*.sql and supabase/sql-tests/sharing_access_control.sql)
              run: |
                  DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
                  bash scripts/ci/sql-proofs.test.sh
                  # One lane: in two lanes cancel_link_db_clock and cancel_link_tombstone_race
                  # block each other until the job times out (PR #140).
                  bash scripts/ci/sql-proofs.sh "$DB_URL" 1 tests/sql/*.sql supabase/sql-tests/sharing_access_control.sql

    stack-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 6
        env:
            SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
            CLEFFY_UI_CHROMIUM: /usr/bin/google-chrome
        steps:
            - *checkout
            - *reserve-ports
            - *setup-cli
            - *start-stack-bg
            - *setup-node
            - *restore-node-modules
            - *npm-ci
            - *save-pristine-node-modules
            - *wait-stack
            - *realtime-probe
            - *replay-migrations
            - name: The runner's Chrome is installed
              run: |
                  "$CLEFFY_UI_CHROMIUM" --version || { echo "::error::${CLEFFY_UI_CHROMIUM} is missing or does not run; this job uses the runner's Chrome and never downloads one"; exit 1; }
            - name: First touch and layout of the Toolbar in Chromium (toolbarFirstTouch.test.ts, toolbarLayout.test.ts)
              run: npx vitest run tests/ui/toolbarFirstTouch.test.ts tests/ui/toolbarLayout.test.ts
            - name: The viewer header with an ensemble in Chromium (viewerHeaderPresenceLayout.test.ts)
              run: npx vitest run tests/ui/viewerHeaderPresenceLayout.test.ts
            - name: Cancel-link store test (billingCancelStore.ts against the local stack)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
                      npx vitest run tests/billing/cancelLinkStore.test.ts
            # Storage accounting and the thumbnail lifecycle through the real
            # Storage API (its policy test, then its service-path write), which
            # the SQL proofs can only imitate (20261022100900, 20261022101000).
            - name: Storage API test (storageLifecycle.test.ts against the local stack)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_ANON_KEY="$ANON_KEY" \
                  CLEFFY_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
                      npx vitest run tests/storage/storageLifecycle.test.ts
            # Admin createUser skips before_user_created; this is the HTTP path
            # the 2026-11-11 prod smoke test used. The SQL proof covers the
            # trigger; this covers GoTrue actually hitting it.
            - name: Admin createUser age-gate backstop (ageGateAdminCreateUser.test.ts)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
                      npx vitest run tests/auth/ageGateAdminCreateUser.test.ts
            # The SQL proof sets JWT claims by hand; this checks GoTrue's own
            # tokens (guest, roster student, teacher) and a real sign-up's
            # attribution against record_web_events and its trigger.
            - name: Web events and sign-up attribution (webEventsLocal.test.ts)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_ANON_KEY="$ANON_KEY" \
                  CLEFFY_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
                      npx vitest run tests/analytics/webEventsLocal.test.ts
            - name: QA seeded states sign in (qaSeedStatesLocal.test.ts)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
                  CLEFFY_REQUIRE_LOCAL_DB=1 \
                  CLEFFY_LOCAL_SUPABASE_URL="$API_URL" \
                  CLEFFY_LOCAL_ANON_KEY="$ANON_KEY" \
                      npx vitest run tests/qa/qaSeedStatesLocal.test.ts
            - name: QA seeded states sign in through the login form (qaSeedStatesLogin.test.ts)
              run: |
                  eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
                  VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
                      npx vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/vite.log 2>&1 &
                  for _ in $(seq 60); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
                  CLEFFY_REQUIRE_LOCAL_DB=1 CLEFFY_E2E_BASE=http://127.0.0.1:5173 \
                      npx vitest run tests/qa/qaSeedStatesLogin.test.ts || { cat /tmp/vite.log; exit 1; }

    omr-service:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                working-directory: services/omr-service
        steps:
            # Full history: check:engine-version diffs against the base ref, and a
            # depth-1 clone has no origin/main to diff against — the script would
            # silently skip and let an unbumped ENGINE_VERSION through.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              id: node
              with:
                  node-version: 22
            # Cache paths resolve from the workspace root, not the run
            # working-directory.
            - uses: actions/cache/restore@v4
              id: node-modules
              with:
                  path: services/omr-service/node_modules
                  key: omr-node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('services/omr-service/package-lock.json') }}
            - name: npm ci
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci
            - if: steps.node-modules.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: services/omr-service/node_modules
                  key: ${{ steps.node-modules.outputs.cache-primary-key }}
            - run: npm run check:engine-version
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    # Does the branch still describe the live project?
    #
    # Added after migrations were applied straight to production ahead of the
    # merge that carried them: `main` stopped describing production and nothing
    # said so. Supabase's GitHub integration deploys on merge but never checks
    # that the branch was the source of what is already live, so this is the only
    # thing standing between "someone ran it from the dashboard" and a `main` that
    # quietly lies about production.
    #
    # Reads only — it never applies or deploys anything; the integration does
    # that.
    supabase-drift:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Fork PRs get no secrets, so the check could only ever fail there for a
        # reason that is not about the code.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # Without the token this job cannot answer its question. It warns
            # rather than fails ONLY for that case, so adding the guard does not
            # redden every branch before the secret exists — but it says so
            # loudly, because a guard nobody notices is off is worse than none.
            # Once SUPABASE_ACCESS_TOKEN is set, drift is a hard failure.
            - name: Check for drift against the live project
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'jibgwgosihadbjgxdsfe' }}
              run: |
                  if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                      echo "::warning title=Supabase drift check is INERT::SUPABASE_ACCESS_TOKEN is not set on this repository, so nothing verified that this branch matches the live project. Add it under Settings -> Secrets and variables -> Actions."
                      exit 0
                  fi
                  node scripts/check-supabase-drift.mjs

    # The Edge Functions type-checked the way Deno loads them (launchfix P3,
    # Codex r2 on #70). supabase/functions/deno.json sets nodeModulesDir
    # "none", so npm: specifiers resolve from Deno's own cache: no npm ci, and
    # the repo-root package.json no longer puts Deno in node_modules mode.
    # Deno 2.1.4: the version the local edge runtime (1.77.4) is built on.
    # Every entry point, score-analyze included since its client type was fixed
    # (P3 fix round 3).
    edge-functions-deno:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.1.4
            - name: deno check the Edge Function entry points
              run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
            - name: Shared IMSLP cache Deno regression tests
              run: deno test --config supabase/functions/deno.json supabase/functions/_shared/imslpPdfCacheStore_test.ts
            - name: Server-Timing measurement Deno tests
              run: deno test --config supabase/functions/deno.json supabase/functions/_shared/serverTiming_test.ts
            - name: imslp-work license timing Deno tests
              run: >-
                  deno test --config supabase/functions/deno.json --allow-read=tests/imslp/fixtures
                  supabase/functions/_shared/imslpWorkLicenses_test.ts
            - name: imslp-work handler timing log Deno tests
              run: >-
                  deno test --config supabase/functions/deno.json --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY
                  supabase/functions/imslp-work/index_test.ts
            - name: imslp-download Server-Timing Deno tests
              run: deno test --config supabase/functions/deno.json supabase/functions/imslp-download/timing_test.ts
            - name: Share v2 Edge Function Deno tests
              run: >-
                  deno test --config supabase/functions/deno.json
                  supabase/functions/_shared/shareSession_test.ts
                  supabase/functions/share-session/handler_test.ts
                  supabase/functions/share-invite/handler_test.ts
                  supabase/functions/share-invite-accept/handler_test.ts

    ci-ok:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        if: always()
        needs: [lint, typecheck, build, test, db-proofs, stack-tests, omr-service, supabase-drift, edge-functions-deno]
        steps:
            - name: Every required job succeeded (supabase-drift may skip on a fork PR)
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
              run: |
                  echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  failed="$(echo "$NEEDS" | jq -r --arg fork "$FORK_PR" 'to_entries[] | select(.value.result != "success") | select(($fork == "true" and .key == "supabase-drift" and .value.result == "skipped") | not) | .key')"
                  if [ -n "$failed" ]; then
                      echo "::error::required jobs did not succeed: $(echo $failed)"
                      exit 1
                  fi

    # Alias of ci-ok: protect-main and the factory still require the `checks`
    # context. `if: always()` because a skipped required check counts as passing.
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        if: always()
        needs: [ci-ok]
        steps:
            - name: ci-ok succeeded
              env:
                  CI_OK: ${{ needs.ci-ok.result }}
              run: test "$CI_OK" = success
