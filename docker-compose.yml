# Production-style: build the static bundle, serve on http://localhost:5173
#   docker compose up --build
#
# Dev mode with hot reload instead:
#   docker compose --profile dev up dev
#
# Both read VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY from ./.env
# (compose substitutes them into build args; the dev server reads .env itself).

services:
    app:
        build:
            context: .
            args:
                VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
                VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        ports:
            - '5173:80'

    dev:
        profiles: ['dev']
        image: node:22-alpine
        working_dir: /app
        volumes:
            - .:/app
            - dev_node_modules:/app/node_modules
        command: sh -c "npm ci && npm run dev -- --host --port 5173"
        ports:
            - '5173:5173'

    # Play-along OMR service (Audiveris). Start with:
    #   docker compose --profile omr up --build omr
    # Point the score-analyze Edge Function at it via the OMR_SERVICE_URL secret
    # (e.g. a tunnel to localhost:8090 for local testing).
    omr:
        profiles: ['omr']
        build: services/omr-service
        environment:
            OMR_SERVICE_SECRET: ${OMR_SERVICE_SECRET}
            SUPABASE_URL: ${VITE_SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        ports:
            - '8090:8080'

volumes:
    dev_node_modules:
