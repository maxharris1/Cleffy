server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route (e.g. /doc/…, /join/…) falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must revalidate so app updates roll out promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
